name: release

# Runs the tests on every push. Pushing a tag like v2.0.1 also builds the
# installer and portable exe and attaches them to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build installer and portable exe
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run build && npx electron-builder --win nsis zip --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
